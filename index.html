<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura Notes PRO 5.0 — Полноценный текстовый редактор</title>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Стили и иконки -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }

    .glass-effect {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Стили визуального редактора */
    #visualEditor {
      outline: none;
      line-height: 1.75;
      font-size: 16px;
    }
    #visualEditor:empty:before {
      content: attr(data-placeholder);
      color: #64748b;
      pointer-events: none;
    }
    #visualEditor h1 { font-size: 1.85rem; font-weight: 800; margin: 1.2rem 0 0.5rem; }
    #visualEditor h2 { font-size: 1.4rem; font-weight: 700; margin: 1rem 0 0.4rem; color: #818cf8; }
    #visualEditor h3 { font-size: 1.15rem; font-weight: 600; margin: 0.8rem 0 0.3rem; }
    #visualEditor p { margin-bottom: 0.75rem; }
    #visualEditor ul { list-style: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
    #visualEditor ol { list-style: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
    #visualEditor blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; color: #94a3b8; font-style: italic; margin: 1rem 0; }

    /* Таблицы */
    #visualEditor table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
      border-radius: 8px;
      overflow: hidden;
    }
    #visualEditor th {
      background: rgba(99, 102, 241, 0.18);
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    #visualEditor td {
      padding: 10px 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .chart-box {
      background: rgba(99, 102, 241, 0.05);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
      text-align: center;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#070b14] text-slate-800 dark:text-slate-100 h-screen overflow-hidden flex flex-col font-sans transition-colors duration-300">

  <!-- ВСПЛЫВАЮЩЕЕ МЕНЮ ПРИ ВЫДЕЛЕНИИ ТЕКСТА МЫШКОЙ -->
  <div id="floatingToolbar" onmousedown="event.preventDefault()" class="fixed hidden z-50 bg-slate-900 text-white border border-slate-700 rounded-xl shadow-2xl px-2 py-1.5 flex items-center gap-1 transition-opacity">
    <button onclick="formatDoc('bold')" class="p-1.5 rounded-lg hover:bg-slate-700 font-bold text-xs" title="Жирный">B</button>
    <button onclick="formatDoc('italic')" class="p-1.5 rounded-lg hover:bg-slate-700 italic text-xs" title="Курсив">I</button>
    <button onclick="formatDoc('underline')" class="p-1.5 rounded-lg hover:bg-slate-700 underline text-xs" title="Подчеркнутый">U</button>
    <button onclick="formatDoc('strikeThrough')" class="p-1.5 rounded-lg hover:bg-slate-700 line-through text-xs" title="Зачеркнутый">S</button>
    <span class="h-4 w-[1px] bg-slate-700 mx-1"></span>
    <!-- Быстрый маркер выделения -->
    <button onclick="highlightText('#fef08a', '#1e293b')" class="w-4 h-4 rounded-full bg-yellow-300 border border-white/20" title="Желтый маркер"></button>
    <button onclick="highlightText('#bbf7d0', '#1e293b')" class="w-4 h-4 rounded-full bg-green-300 border border-white/20" title="Зеленый маркер"></button>
    <button onclick="highlightText('#fbcfe8', '#1e293b')" class="w-4 h-4 rounded-full bg-pink-300 border border-white/20" title="Розовый маркер"></button>
    <button onclick="highlightText('transparent', 'inherit')" class="px-1.5 py-0.5 rounded hover:bg-slate-700 text-[10px] text-slate-300" title="Убрать маркер">Сброс</button>
  </div>

  <div class="flex-1 flex h-full w-full overflow-hidden">

    <!-- Левая боковая панель со списком заметок -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 flex flex-col h-full bg-white/80 dark:bg-[#0c1222]/80 glass-effect border-r border-slate-200/80 dark:border-slate-800/80 z-20 flex-shrink-0">
      
      <!-- Шапка -->
      <div class="p-4 border-b border-slate-200/60 dark:border-slate-800/60 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold tracking-tight text-lg">Aura Notes</span>
              <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded-full bg-gradient-to-r from-amber-500 to-orange-500 text-white">5.0</span>
            </div>
            <span class="text-[11px] text-slate-400 block -mt-1 font-medium">Smart Rich Editor</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="themeToggle" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition" title="Сменить тему">
            <i data-lucide="moon" class="w-4 h-4"></i>
          </button>
          <button id="authModalBtn" class="flex items-center gap-1.5 p-1.5 pr-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold transition">
            <div id="userAvatar" class="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center overflow-hidden">
              <i data-lucide="user" class="w-3.5 h-3.5 text-slate-500"></i>
            </div>
            <span id="userName" class="truncate max-w-[85px]">Войти</span>
          </button>
        </div>
      </div>

      <!-- Поиск и создание -->
      <div class="p-4 space-y-3 flex-shrink-0">
        <div class="flex gap-2">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Поиск по заметкам..." 
                   class="w-full pl-9 pr-3 py-2 bg-slate-100/90 dark:bg-slate-800/40 rounded-xl text-sm border border-transparent focus:border-indigo-500/30 focus:bg-white dark:focus:bg-slate-900 focus:outline-none transition">
          </div>
          <button id="createNoteBtn" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold shadow-md shadow-indigo-600/20 transition flex items-center gap-1 text-sm" title="Новая заметка">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Теги -->
        <div id="tagsList" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
          <button class="tag-chip active px-3 py-1 rounded-full bg-indigo-600 text-white font-medium" data-tag="all">Все</button>
        </div>
      </div>

      <!-- Список карточек заметок -->
      <div id="notesContainer" class="flex-1 min-h-0 overflow-y-auto px-3 space-y-2 custom-scroll pb-3"></div>

      <!-- Подвал -->
      <div class="p-3.5 border-t border-slate-200/60 dark:border-slate-800/60 flex items-center justify-between text-xs text-slate-400 flex-shrink-0">
        <div class="flex items-center gap-1.5" id="syncStatus">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>Локальное автосохранение</span>
        </div>
        <span id="notesCount">0 заметок</span>
      </div>
    </aside>

    <!-- Правая рабочая область -->
    <main id="editorWrapper" class="flex-1 flex flex-col bg-white dark:bg-[#070b14] hidden md:flex h-full min-w-0 min-h-0 overflow-hidden relative">
      
      <!-- Верхняя шапка с действиями -->
      <header class="h-14 py-2 border-b border-slate-100 dark:border-slate-800/70 px-4 lg:px-6 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar flex-shrink-0">
        <div class="flex items-center gap-2">
          <button id="backBtn" class="md:hidden p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>

          <!-- Таймер Помодоро -->
          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-400 text-xs font-bold">
            <i data-lucide="timer" class="w-3.5 h-3.5"></i>
            <span id="pomoTime">25:00</span>
            <button id="pomoToggle" class="ml-1 hover:underline text-[11px]">Старт</button>
          </div>
        </div>

        <!-- Правые кнопки -->
        <div class="flex items-center gap-1 text-slate-500">
          <!-- Цвет карточки -->
          <div class="flex items-center gap-1.5 mr-2 border-r border-slate-200 dark:border-slate-800 pr-3">
            <button onclick="setNoteColor('default')" class="w-3.5 h-3.5 rounded-full bg-slate-300 dark:bg-slate-700" title="Обычный"></button>
            <button onclick="setNoteColor('indigo')" class="w-3.5 h-3.5 rounded-full bg-indigo-500" title="Синий"></button>
            <button onclick="setNoteColor('emerald')" class="w-3.5 h-3.5 rounded-full bg-emerald-500" title="Зеленый"></button>
            <button onclick="setNoteColor('amber')" class="w-3.5 h-3.5 rounded-full bg-amber-500" title="Желтый"></button>
            <button onclick="setNoteColor('rose')" class="w-3.5 h-3.5 rounded-full bg-rose-500" title="Красный"></button>
          </div>

          <!-- Экспорт в Word -->
          <button onclick="exportToWord()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-600 text-white hover:bg-blue-700 transition text-xs font-bold mr-1 shadow-sm" title="Скачать в Microsoft Word (.doc)">
            <i data-lucide="file-down" class="w-3.5 h-3.5"></i> Скачать Word
          </button>

          <button id="voiceBtn" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Голосовой ввод">
            <i data-lucide="mic" class="w-4 h-4"></i>
          </button>
          <button id="lockToggle" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Пароль">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </button>
          <button id="pinToggle" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Закрепить">
            <i data-lucide="pin" class="w-4 h-4"></i>
          </button>
          <button id="deleteNote" class="p-2 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/30 text-rose-500 transition" title="Удалить">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- ПАНЕЛЬ РЕДАКТИРОВАНИЯ ТЕКСТА -->
      <div onmousedown="if(event.target.tagName !== 'SELECT' && event.target.tagName !== 'INPUT') event.preventDefault()" 
           class="px-6 py-2 bg-slate-50/90 dark:bg-slate-900/70 border-b border-slate-200/70 dark:border-slate-800/80 flex flex-wrap items-center gap-1.5 text-xs font-semibold flex-shrink-0">
        
        <!-- Выбор шрифта -->
        <select onchange="changeFontFamily(this.value)" class="px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none text-xs cursor-pointer">
          <option value="Plus Jakarta Sans, sans-serif">Шрифт: Современный</option>
          <option value="Georgia, serif">Шрифт: Книжный (Serif)</option>
          <option value="Arial, sans-serif">Шрифт: Классический Arial</option>
          <option value="JetBrains Mono, monospace">Шрифт: Печатный (Mono)</option>
          <option value="Comic Sans MS, cursive">Шрифт: Рукописный</option>
        </select>

        <!-- Выбор размера текста -->
        <select onchange="formatDoc('fontSize', this.value)" class="px-2 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none text-xs cursor-pointer">
          <option value="3">Размер: Обычный</option>
          <option value="2">Мелкий</option>
          <option value="4">Средний +</option>
          <option value="5">Крупный</option>
          <option value="6">Заголовок</option>
          <option value="7">Огромный</option>
        </select>

        <span class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-0.5"></span>

        <!-- Начертание -->
        <button onclick="formatDoc('bold')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="Жирный (Ctrl+B)">
          <i data-lucide="bold" class="w-4 h-4"></i>
        </button>
        <button onclick="formatDoc('italic')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="Курсив (Ctrl+I)">
          <i data-lucide="italic" class="w-4 h-4"></i>
        </button>
        <button onclick="formatDoc('underline')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="Подчеркнутый (Ctrl+U)">
          <i data-lucide="underline" class="w-4 h-4"></i>
        </button>
        <button onclick="formatDoc('strikeThrough')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="Зачеркнутый">
          <i data-lucide="strikethrough" class="w-4 h-4"></i>
        </button>

        <span class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-0.5"></span>

        <!-- Цвет текста -->
        <label class="flex items-center gap-1 px-2 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-indigo-500" title="Цвет текста">
          <i data-lucide="baseline" class="w-3.5 h-3.5 text-indigo-500"></i>
          <span>Цвет</span>
          <input type="color" onchange="formatDoc('foreColor', this.value)" value="#6366f1" class="w-4 h-4 border-0 bg-transparent cursor-pointer p-0">
        </label>

        <!-- Выделение маркером -->
        <div class="flex items-center gap-1 px-2 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700" title="Выделить текст маркером">
          <i data-lucide="highlighter" class="w-3.5 h-3.5 text-amber-500 mr-0.5"></i>
          <button onclick="highlightText('#fef08a', '#1e293b')" class="w-3.5 h-3.5 rounded-full bg-yellow-300 border border-slate-400/30" title="Желтый маркер"></button>
          <button onclick="highlightText('#bbf7d0', '#1e293b')" class="w-3.5 h-3.5 rounded-full bg-green-300 border border-slate-400/30" title="Зеленый маркер"></button>
          <button onclick="highlightText('#bfdbfe', '#1e293b')" class="w-3.5 h-3.5 rounded-full bg-blue-300 border border-slate-400/30" title="Голубой маркер"></button>
          <button onclick="highlightText('#fbcfe8', '#1e293b')" class="w-3.5 h-3.5 rounded-full bg-pink-300 border border-slate-400/30" title="Розовый маркер"></button>
          <button onclick="highlightText('transparent', 'inherit')" class="text-[10px] text-slate-400 hover:text-rose-500 ml-0.5" title="Сбросить выделение">✕</button>
        </div>

        <span class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-0.5"></span>

        <!-- Выравнивание и Списки -->
        <button onclick="formatDoc('justifyLeft')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="По левому краю">
          <i data-lucide="align-left" class="w-4 h-4"></i>
        </button>
        <button onclick="formatDoc('justifyCenter')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="По центру">
          <i data-lucide="align-center" class="w-4 h-4"></i>
        </button>
        <button onclick="formatDoc('insertUnorderedList')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="Маркированный список">
          <i data-lucide="list" class="w-4 h-4"></i>
        </button>
        <button onclick="formatDoc('insertOrderedList')" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" title="Нумерованный список">
          <i data-lucide="list-ordered" class="w-4 h-4"></i>
        </button>
        <button onclick="formatDoc('removeFormat')" class="p-1.5 rounded-lg hover:bg-rose-100 dark:hover:bg-rose-950/40 text-rose-500" title="Очистить всё форматирование">
          <i data-lucide="eraser" class="w-4 h-4"></i>
        </button>

        <span class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-0.5"></span>

        <!-- Вставка таблиц, диаграмм, картинок -->
        <button onclick="openTableModal()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 transition shadow-sm">
          <i data-lucide="table" class="w-3.5 h-3.5 text-indigo-500"></i> + Таблица
        </button>

        <button onclick="openChartModal()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 transition shadow-sm">
          <i data-lucide="pie-chart" class="w-3.5 h-3.5 text-emerald-500"></i> + Диаграмма
        </button>

        <label class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 transition shadow-sm cursor-pointer">
          <i data-lucide="image-plus" class="w-3.5 h-3.5 text-amber-500"></i> + Картинка
          <input type="file" id="imageUploadInput" accept="image/*" class="hidden">
        </label>

        <button onclick="openSketchModal()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 transition shadow-sm">
          <i data-lucide="pen-tool" class="w-3.5 h-3.5 text-purple-500"></i> + Скетч
        </button>
      </div>

      <!-- Заголовок и теги -->
      <div class="px-8 pt-5 pb-2 flex-shrink-0">
        <input type="text" id="noteTitle" placeholder="Название документа..." 
               class="w-full text-2xl md:text-3xl font-extrabold bg-transparent outline-none placeholder:text-slate-300 dark:placeholder:text-slate-700">
        <div class="flex items-center justify-between mt-2">
          <input type="text" id="noteTags" placeholder="Добавить теги через запятую..." 
                 class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 bg-transparent outline-none placeholder:text-slate-400 w-2/3">
          <div class="text-[11px] text-slate-400 flex items-center gap-2 font-medium">
            <span id="statsWords">0 слов</span>
            <span>•</span>
            <span id="statsChars">0 симв.</span>
          </div>
        </div>
      </div>

      <!-- Галерея прикрепленных картинок и скетчей -->
      <div id="attachmentsBar" class="px-8 py-2 flex gap-3 overflow-x-auto no-scrollbar hidden border-b border-slate-100 dark:border-slate-800/50 flex-shrink-0"></div>

      <!-- ОСНОВНОЕ ПОЛЕ ДОКУМЕНТА -->
      <div class="flex-1 min-h-0 overflow-y-auto custom-scroll px-8 py-4 pb-28">
        <div id="visualEditor" contenteditable="true" data-placeholder="Выделите любой текст мышкой, чтобы сделать его жирным, поменять шрифт, цвет или выделить маркером..." 
             class="max-w-4xl text-slate-700 dark:text-slate-200 min-h-full"></div>
      </div>

    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: Генератор таблиц -->
  <div id="tableModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white dark:bg-[#0c1222] border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
      <h3 class="text-lg font-bold mb-4">Вставить таблицу</h3>
      <div class="space-y-3 text-xs">
        <div>

  <!-- МОДАЛЬНОЕ ОКНО: Генератор диаграмм -->
  <div id="chartModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">

      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">Добавить готовую диаграмму</h3>

  <!-- МОДАЛЬНОЕ ОКНО: Скетчпад -->

  <!-- Просмотр картинки на весь экран -->

  <!-- Модальное окно Авторизации -->
  <div id="authModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white dark:bg-[#0c1222] border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
      <button id="closeAuthModal" class="absolute right-4 top-4 text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
      <div class="text-center mb-6">
        <h3 class="text-lg font-bold">Синхронизация аккаунта</h3>
        <p class="text-xs text-slate-400 mt-1">Доступ к заметкам на компьютере и телефоне</p>
      </div>
      <div id="authActions" class="space-y-3">
        <button id="loginGoogle" class="w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold text-xs flex items-center justify-center gap-2.5 transition active:scale-95">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>

          <span>Войти через Google</span>

      <div id="userInfo" class="hidden text-center space-y-4">
        <div class="flex flex-col items-center gap-2">
          <img id="modalUserPhoto" src="" alt="" referrerpolicy="no-referrer" class="w-12 h-12 rounded-full border-2 border-indigo-500 hidden">
          <p class="text-xs">Аккаунт: <span id="userEmail" class="text-indigo-500 font-bold block mt-0.5"></span></p>
        </div>
        <button id="logoutBtn" class="w-full py-2 rounded-xl border border-rose-500/30 hover:bg-rose-500/10 text-rose-500 text-xs font-bold transition">Выйти из аккаунта</button>
      </div>
    </div>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    // --- ВАША КОНФИГУРАЦИЯ FIREBASE (notes-sync-4e0e7) ---
    const firebaseConfig = {
      apiKey: "AIzaSyDWzCYHUuGUEPqvIbDJ3MqZGXPUIi0bgFY",
      authDomain: "notes-sync-4e0e7.firebaseapp.com",
      projectId: "notes-sync-4e0e7",
      storageBucket: "notes-sync-4e0e7.firebasestorage.app",
      messagingSenderId: "370867877487",
      appId: "1:370867877487:web:4136c6f8365c9a87a2ff9a",
      measurementId: "G-SZT7KTHG2S"
    };

    let auth = null, db = null, currentUser = null, unsubscribeSync = null;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      // Включаем офлайн-кэширование Firestore
      db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    } catch (e) {
      console.error("Ошибка инициализации Firebase:", e);
    }

    // --- СТАРТОВАЯ ЗАМЕТКА С ПРИМЕРАМИ ВЫДЕЛЕНИЯ И ШРИФТОВ ---
    const defaultCleanNote = {
      id: '1',
      title: 'Добро пожаловать в Aura Notes 5.0!',
      content: `
        <p>Попробуйте <b>выделить любое слово мышкой</b> — прямо над текстом появится быстрое меню, где можно сделать текст <b>жирным</b>, <i>курсивным</i>, <u>подчеркнутым</u> или <span style="background-color: rgb(254, 240, 138); color: rgb(30, 41, 59); padding: 2px 6px; border-radius: 4px;">выделить его ярким маркером</span>!</p>
        <h2>Новые инструменты оформления текста</h2>
        <ul>
          <li><b>Выбор шрифта и размера:</b> меняйте стиль шрифта от современного до книжного или рукописного прямо на верхней панели.</li>
          <li><b>Цвет текста и Маркер:</b> выделяйте важные мысли <span style="color: #ec4899; font-weight: bold;">любым цветом</span> или цветной заливкой.</li>
          <li><b>Готовые таблицы и экспорт в Word:</b> создавайте таблицы в один клик и выгружайте документ в формат <b>.doc</b>.</li>
        </ul>
        <h2>Пример таблицы задач</h2>
        <table>
          <thead>
            <tr>
              <th>Задача / Этап</th>
              <th>Приоритет</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Оформление текста и шрифтов</td>
              <td>Высокий 🔥</td>
              <td>Готово ✅</td>
            </tr>
            <tr>
              <td>Выделение важных мыслей маркером</td>
              <td>Средний ⚡</td>
              <td>Активно ✨</td>
            </tr>
          </tbody>
        </table>
      `,
      tags: ['главная', 'редактор'],
      pinned: true,
      locked: false,
      color: 'indigo',
      attachments: [],
      updatedAt: new Date().toISOString()
    };

    function loadNotes() {
      const saved = JSON.parse(localStorage.getItem('aura_v5_notes') || localStorage.getItem('aura_v4_clean_notes') || 'null');
      if (saved && Array.isArray(saved) && saved.length > 0) return saved;
      return [defaultCleanNote];
    }

    let notes = loadNotes();
    let currentId = notes[0]?.id || null;
    let currentTag = 'all';
    let searchQuery = '';

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      saveLocal();
      loadActiveNote();
      initSketchpad();
      initFloatingSelectionMenu();
      lucide.createIcons();

      if (auth) {
        auth.onAuthStateChanged(async (user) => {
          currentUser = user;
          updateAuthUI(user);
          if (user) {
            await setupRealtimeSync(user.uid);
          } else {
            if (unsubscribeSync) {
              unsubscribeSync();
              unsubscribeSync = null;
            }
            document.getElementById('syncStatus').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>Локальное автосохранение</span>`;
          }
        });
      }
    });

    // --- ОБРАБОТЧИКИ ВХОДА ЧЕРЕЗ GOOGLE И ВЫХОДА ---
    document.getElementById('loginGoogle').addEventListener('click', async () => {
      if (!auth) return alert('Firebase не инициализирован');
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try {
        await auth.signInWithPopup(provider);
        document.getElementById('authModal').classList.add('hidden');
      } catch (err) {
        console.error('Ошибка входа через Google:', err);
        if (err.code === 'auth/unauthorized-domain') {
          alert('Домен не разрешен в Firebase! Добавьте адрес вашего сайта в раздел Authentication -> Settings -> Authorized domains.');
        } else if (err.code !== 'auth/popup-closed-by-user') {
          alert('Ошибка входа: ' + err.message);
        }
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (!auth) return;
      await auth.signOut();
      document.getElementById('authModal').classList.add('hidden');
    });

    // --- ФОРМАТИРОВАНИЕ ТЕКСТА ---
    function formatDoc(cmd, value = null) {
      const editor = document.getElementById('visualEditor');
      editor.focus();
      document.execCommand('styleWithCSS', false, true);
      document.execCommand(cmd, false, value);
      handleInput();
    }

    function changeFontFamily(fontName) {
      const editor = document.getElementById('visualEditor');
      editor.focus();
      const sel = window.getSelection();
      if (sel && !sel.isCollapsed) {
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('fontName', false, fontName);
      } else {
        editor.style.fontFamily = fontName;
      }
      handleInput();
    }

    function highlightText(bgColor, textColor) {
      const editor = document.getElementById('visualEditor');
      editor.focus();
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('hiliteColor', false, bgColor);
      if (textColor && bgColor !== 'transparent') {
        document.execCommand('foreColor', false, textColor);
      }
      document.getElementById('floatingToolbar').classList.add('hidden');
      handleInput();
    }

    function initFloatingSelectionMenu() {
      const floating = document.getElementById('floatingToolbar');
      const editor = document.getElementById('visualEditor');

      document.addEventListener('selectionchange', () => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || !editor.contains(sel.anchorNode)) {
          floating.classList.add('hidden');
          return;
        }

        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        if (rect.width > 5) {
          floating.classList.remove('hidden');
          const top = Math.max(10, rect.top - 48);
          const left = Math.min(window.innerWidth - 260, Math.max(10, rect.left + rect.width / 2 - 110));
          floating.style.top = `${top}px`;
          floating.style.left = `${left}px`;
        }
      });
    }

    // --- ЭКСПОРТ В MICROSOFT WORD (.DOC) ---
    function exportToWord() {
      const note = notes.find(n => n.id === currentId);
      if (!note) return alert('Сначала выберите заметку!');

      const htmlBody = document.getElementById('visualEditor').innerHTML;

      let imagesHtml = '';
      if (note.attachments && note.attachments.length > 0) {
        imagesHtml = '<h3>Прикрепленные изображения:</h3>' + note.attachments.map(src => `<p><img src="${src}" style="max-width:500px; border-radius:8px;" /></p>`).join('');
      }

      const wordTemplate = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' 
              xmlns:w='urn:schemas-microsoft-com:office:word' 
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset="utf-8">
          <title>${note.title || 'Заметка'}</title>
          <style>
            body { font-family: 'Arial', sans-serif; font-size: 12pt; color: #1e293b; line-height: 1.6; }
            h1 { font-size: 20pt; color: #1e1b4b; margin-bottom: 10pt; }
            h2 { font-size: 15pt; color: #4338ca; margin-top: 14pt; margin-bottom: 6pt; }
            h3 { font-size: 13pt; color: #4f46e5; }
            table { border-collapse: collapse; width: 100%; margin: 12pt 0; }
            th, td { border: 1px solid #94a3b8; padding: 8pt 10pt; text-align: left; }
            th { background-color: #eef2ff; font-weight: bold; }
            .tags { font-size: 10pt; color: #6366f1; margin-bottom: 14pt; }
          </style>
        </head>
        <body>
          <h1>${note.title || 'Без названия'}</h1>
          ${note.tags && note.tags.length ? `<div class="tags">Теги: #${note.tags.join(' #')}</div>` : ''}
          <div>${htmlBody}</div>
          ${imagesHtml}
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff', wordTemplate], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${(note.title || 'Документ').replace(/[\\/:*?"<>|]/g, '_')}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ С FIRESTORE ---
    async function setupRealtimeSync(uid) {
      document.getElementById('syncStatus').innerHTML = `<span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span><span>Облако подключено</span>`;
      const userNotesRef = db.collection('users').doc(uid).collection('notes');

      // Если в облаке пусто, выгружаем туда текущие локальные заметки
      try {
        const initialSnap = await userNotesRef.get();
        if (initialSnap.empty && notes.length > 0) {
          for (const localNote of notes) {
            await userNotesRef.doc(String(localNote.id)).set(localNote);
          }
        }
      } catch (e) {
        console.warn("Ожидание правил доступа Firestore:", e);
      }

      if (unsubscribeSync) unsubscribeSync();

      unsubscribeSync = userNotesRef.onSnapshot(snap => {
        if (!snap.empty) {
          notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          localStorage.setItem('aura_v5_notes', JSON.stringify(notes));
          renderTags();
          renderNotesList();

          // Обновляем текст в редакторе только если пользователь сейчас сам не печатает в нем
          const activeEl = document.activeElement;
          const isTyping = activeEl && (activeEl.id === 'visualEditor' || activeEl.id === 'noteTitle' || activeEl.id === 'noteTags');
          if (!isTyping) {
            if (!notes.some(n => n.id === currentId)) {
              currentId = notes[0]?.id || null;
            }
            loadActiveNote();
          }
        }
      }, err => {
        console.error("Ошибка синхронизации Firestore:", err);
        document.getElementById('syncStatus').innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Проверьте Rules в Firebase</span>`;
      });
    }

    async function syncNote(note) {
      if (currentUser && db) {
        await db.collection('users').doc(currentUser.uid).collection('notes').doc(String(note.id)).set(note).catch(console.error);
      }
    }

    function saveLocal() {
      localStorage.setItem('aura_v5_notes', JSON.stringify(notes));
      renderTags();
      renderNotesList();
      calcStats();
    }

    // --- ЦВЕТА КАРТОЧЕК ---
    const colorStyles = {
      default: 'bg-white/40 dark:bg-slate-900/30 border-transparent',
      indigo: 'bg-indigo-500/10 border-indigo-500/30',
      emerald: 'bg-emerald-500/10 border-emerald-500/30',
      amber: 'bg-amber-500/10 border-amber-500/30',
      rose: 'bg-rose-500/10 border-rose-500/30'
    };

    function setNoteColor(color) {
      const note = notes.find(n => n.id === currentId);
      if (!note) return;
      note.color = color;
      saveLocal();
      syncNote(note);
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html || '';
      return tmp.textContent || tmp.innerText || '';
    }

    // --- СПИСОК ЗАМЕТОК ---
    function renderNotesList() {
      const container = document.getElementById('notesContainer');
      const filtered = notes.filter(n => {
        const plainText = stripHtml(n.content);
        const matchesTag = currentTag === 'all' || (n.tags && n.tags.includes(currentTag));
        const matchesSearch = (n.title || '').toLowerCase().includes(searchQuery.toLowerCase()) || plainText.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesTag && matchesSearch;
      }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.updatedAt) - new Date(a.updatedAt));

      document.getElementById('notesCount').textContent = `${notes.length} заметок`;

      container.innerHTML = filtered.map(note => {
        const cStyle = colorStyles[note.color || 'default'];
        const hasImg = note.attachments && note.attachments.length > 0;
        const plainPreview = stripHtml(note.content).trim();
        return `
        <div onclick="selectNote('${note.id}')" 
             class="p-3.5 rounded-2xl cursor-pointer transition-all border ${cStyle} ${note.id === currentId ? 'ring-2 ring-indigo-500 shadow-sm' : 'hover:border-slate-300 dark:hover:border-slate-700'}">
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-sm truncate flex-1">${note.title || 'Без названия'}</h4>
            <div class="flex items-center gap-1">
              ${hasImg ? '<i data-lucide="image" class="w-3.5 h-3.5 text-amber-500"></i>' : ''}
              ${note.locked ? '<i data-lucide="lock" class="w-3.5 h-3.5 text-rose-500"></i>' : ''}
              ${note.pinned ? '<i data-lucide="pin" class="w-3.5 h-3.5 text-indigo-500 fill-indigo-500"></i>' : ''}
            </div>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mt-1">
            ${note.locked ? '🔒 Защищено паролем' : (plainPreview || 'Пустая заметка...')}
          </p>
        </div>
      `}).join('');
      lucide.createIcons();
    }

    function renderTags() {
      const tags = ['all', ...new Set(notes.flatMap(n => n.tags || []))];
      document.getElementById('tagsList').innerHTML = tags.map(t => `
        <button onclick="currentTag='${t}';renderTags();renderNotesList();" class="px-3 py-1 rounded-full whitespace-nowrap text-xs transition ${currentTag === t ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-100 dark:bg-slate-800/60 text-slate-500'}">
          ${t === 'all' ? 'Все' : '#' + t}
        </button>
      `).join('');
    }

    function selectNote(id) {
      const note = notes.find(n => n.id === id);
      if (note && note.locked) {
        if (prompt('Пароль от заметки:') !== note.password) return alert('Неверный пароль!');
      }
      currentId = id;
      loadActiveNote();
      renderNotesList();
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('editorWrapper').classList.remove('hidden');
      }
    }

    function loadActiveNote() {
      const note = notes.find(n => n.id === currentId);
      const editor = document.getElementById('visualEditor');
      if (!note) {
        document.getElementById('noteTitle').value = '';
        editor.innerHTML = '';
        document.getElementById('noteTags').value = '';
        return;
      }

      document.getElementById('noteTitle').value = note.title || '';
      editor.innerHTML = note.content || '';
      document.getElementById('noteTags').value = (note.tags || []).join(', ');

      renderAttachments(note);
      calcStats();
      mermaid.run({ querySelector: '.mermaid' }).catch(() => {});
    }

    function handleInput() {
      const note = notes.find(n => n.id === currentId);
      if (!note) return;
      note.title = document.getElementById('noteTitle').value;
      note.content = document.getElementById('visualEditor').innerHTML;
      note.tags = document.getElementById('noteTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
      note.updatedAt = new Date().toISOString();
      saveLocal();
      syncNote(note);
    }

    document.getElementById('noteTitle').addEventListener('input', handleInput);
    document.getElementById('visualEditor').addEventListener('input', handleInput);
    document.getElementById('noteTags').addEventListener('input', handleInput);

    // --- 1. ВСТАВКА ТАБЛИЦЫ ---
    function openTableModal() { document.getElementById('tableModal').classList.remove('hidden'); }
    function closeTableModal() { document.getElementById('tableModal').classList.add('hidden'); }

    function insertTable() {
      const cols = parseInt(document.getElementById('tableCols').value) || 3;
      const rows = parseInt(document.getElementById('tableRows').value) || 3;
      
      let html = '<table><thead><tr>';
      for (let c = 1; c <= cols; c++) html += `<th>Заголовок ${c}</th>`;
      html += '</tr></thead><tbody>';
      for (let r = 1; r <= rows; r++) {
        html += '<tr>';
        for (let c = 1; c <= cols; c++) html += `<td>Ячейка</td>`;
        html += '</tr>';
      }
      html += '</tbody></table><p><br></p>';

      document.getElementById('visualEditor').innerHTML += html;
      closeTableModal();
      handleInput();
    }

    // --- 2. ВСТАВКА ДИАГРАММЫ ---
    function openChartModal() { document.getElementById('chartModal').classList.remove('hidden'); }
    function closeChartModal() { document.getElementById('chartModal').classList.add('hidden'); }

    async function insertChart(type) {
      let graphDef = type === 'pie' 
        ? `pie title Распределение ресурсов\n    "Разработка" : 50\n    "Дизайн" : 30\n    "Маркетинг" : 20`
        : `graph LR\n    A[Идея] --> B(Прототип)\n    B --> C{Проверка}\n    C -->|Готово| D[Запуск!]`;

      const id = 'mermaidChart_' + Date.now();
      document.getElementById('visualEditor').innerHTML += `<div class="chart-box" contenteditable="false"><div class="mermaid" id="${id}">${graphDef}</div></div><p><br></p>`;
      closeChartModal();
      await mermaid.run({ querySelector: `#${id}` }).catch(console.error);
      handleInput();
    }

    // --- 3. КАРТИНКИ ---
    document.getElementById('imageUploadInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 800;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          addAttachmentToNote(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function addAttachmentToNote(dataUrl) {
      const note = notes.find(n => n.id === currentId);
      if (!note) return;
      if (!note.attachments) note.attachments = [];
      note.attachments.push(dataUrl);
      renderAttachments(note);
      saveLocal();
      syncNote(note);
    }

    function renderAttachments(note) {
      const bar = document.getElementById('attachmentsBar');
      const list = note.attachments || [];
      if (list.length === 0) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      bar.innerHTML = list.map((src, idx) => `
        <div class="relative group flex-shrink-0">
          <img src="${src}" onclick="openLightbox('${src}')" class="h-20 w-28 object-cover rounded-xl border border-slate-200 dark:border-slate-700 cursor-zoom-in">
          <button onclick="removeAttachment(${idx})" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition shadow">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function removeAttachment(index) {
      const note = notes.find(n => n.id === currentId);
      if (!note || !note.attachments) return;
      note.attachments.splice(index, 1);
      renderAttachments(note);
      saveLocal();
      syncNote(note);
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    // --- 4. СКЕТЧПАД ---
    let sketchCanvas, sketchCtx, isDrawing = false;

    function initSketchpad() {
      sketchCanvas = document.getElementById('sketchCanvas');
      sketchCtx = sketchCanvas.getContext('2d');
      sketchCtx.strokeStyle = '#4f46e5';
      sketchCtx.lineWidth = 3;
      sketchCtx.lineCap = 'round';

      const start = (e) => { isDrawing = true; draw(e); };
      const end = () => { isDrawing = false; sketchCtx.beginPath(); };
      const draw = (e) => {
        if (!isDrawing) return;
        const rect = sketchCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        sketchCtx.lineTo(clientX - rect.left, clientY - rect.top);
        sketchCtx.stroke();
        sketchCtx.beginPath();
        sketchCtx.moveTo(clientX - rect.left, clientY - rect.top);
      };

      sketchCanvas.addEventListener('mousedown', start);
      sketchCanvas.addEventListener('mouseup', end);
      sketchCanvas.addEventListener('mousemove', draw);
      sketchCanvas.addEventListener('touchstart', start);
      sketchCanvas.addEventListener('touchend', end);
      sketchCanvas.addEventListener('touchmove', draw);
    }

    function openSketchModal() { document.getElementById('sketchModal').classList.remove('hidden'); clearSketch(); }
    function closeSketchModal() { document.getElementById('sketchModal').classList.add('hidden'); }
    function clearSketch() {
      sketchCtx.fillStyle = '#ffffff';
      sketchCtx.fillRect(0, 0, sketchCanvas.width, sketchCanvas.height);
    }
    function saveSketch() {
      addAttachmentToNote(sketchCanvas.toDataURL('image/png'));
      closeSketchModal();
    }

    // --- 5. ПОМОДОРО И ГОЛОС ---
    let pomoInterval = null, pomoSeconds = 25 * 60;
    document.getElementById('pomoToggle').addEventListener('click', (e) => {
      if (pomoInterval) {
        clearInterval(pomoInterval);
        pomoInterval = null;
        e.target.textContent = 'Старт';
      } else {
        e.target.textContent = 'Пауза';
        pomoInterval = setInterval(() => {
          pomoSeconds--;
          const m = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');
          const s = String(pomoSeconds % 60).padStart(2, '0');
          document.getElementById('pomoTime').textContent = `${m}:${s}`;
          if (pomoSeconds <= 0) {
            clearInterval(pomoInterval);
            alert('🎉 Время фокуса завершено!');
            pomoSeconds = 25 * 60;
          }
        }, 1000);
      }
    });

    document.getElementById('voiceBtn').addEventListener('click', () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert('Используйте Google Chrome для голосового ввода.');
      const recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('visualEditor').innerHTML += `<p>${transcript}</p>`;
        handleInput();
      };
      recognition.start();
    });

    // --- БАЗОВЫЕ КНОПКИ ---
    function calcStats() {
      const plain = stripHtml(document.getElementById('visualEditor').innerHTML).trim();
      const words = plain ? plain.split(/\s+/).length : 0;
      document.getElementById('statsWords').textContent = `${words} слов`;
      document.getElementById('statsChars').textContent = `${plain.length} симв.`;
    }

    document.getElementById('createNoteBtn').addEventListener('click', () => {
      const newNote = { id: String(Date.now()), title: '', content: '<p>Начните вводить текст...</p>', tags: [], pinned: false, locked: false, color: 'default', attachments: [], updatedAt: new Date().toISOString() };
      notes.unshift(newNote);
      currentId = newNote.id;
      saveLocal();
      syncNote(newNote);
      loadActiveNote();
      document.getElementById('noteTitle').focus();
    });

    document.getElementById('deleteNote').addEventListener('click', async () => {
      if (!currentId || !confirm('Удалить эту заметку?')) return;
      const idToDelete = currentId;
      notes = notes.filter(n => n.id !== idToDelete);
      currentId = notes[0]?.id || null;
      saveLocal();
      loadActiveNote();
      if (currentUser && db) {
        await db.collection('users').doc(currentUser.uid).collection('notes').doc(String(idToDelete)).delete().catch(console.error);
      }
    });

    document.getElementById('pinToggle').addEventListener('click', () => {
      const note = notes.find(n => n.id === currentId);
      if (note) { note.pinned = !note.pinned; saveLocal(); syncNote(note); }
    });

    document.getElementById('lockToggle').addEventListener('click', () => {
      const note = notes.find(n => n.id === currentId);
      if (!note) return;
      if (note.locked) { note.locked = false; delete note.password; }
      else {
        const p = prompt('Задайте пароль:');
        if (p) { note.locked = true; note.password = p; }
      }
      saveLocal(); syncNote(note);
    });

    document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderNotesList(); });
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });
    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('editorWrapper').classList.add('hidden');
    });

    const authModal = document.getElementById('authModal');
    document.getElementById('authModalBtn').addEventListener('click', () => authModal.classList.remove('hidden'));
    document.getElementById('closeAuthModal').addEventListener('click', () => authModal.classList.add('hidden'));

    function updateAuthUI(user) {
      const avatarContainer = document.getElementById('userAvatar');
      const modalPhoto = document.getElementById('modalUserPhoto');
      document.getElementById('userName').textContent = user ? (user.displayName?.split(' ')[0] || 'Профиль') : 'Войти';
      document.getElementById('authActions').classList.toggle('hidden', Boolean(user));
      document.getElementById('userInfo').classList.toggle('hidden', !user);

      if (user) {
        document.getElementById('userEmail').textContent = user.email;
        if (user.photoURL) {
          avatarContainer.innerHTML = `<img src="${user.photoURL}" referrerpolicy="no-referrer" class="w-full h-full object-cover">`;
          modalPhoto.src = user.photoURL;
          modalPhoto.classList.remove('hidden');
        }
      } else {
        avatarContainer.innerHTML = `<i data-lucide="user" class="w-3.5 h-3.5 text-slate-500"></i>`;
        modalPhoto.classList.add('hidden');
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
