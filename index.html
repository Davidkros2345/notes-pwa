<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notes App</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS & Lucide Icons & Marked (Markdown Parser) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Markdown Styles */
    .prose h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
    .prose h2 { font-size: 1.3rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.4rem; }
    .prose p { margin-bottom: 0.6rem; line-height: 1.6; }
    .prose ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.6rem; }
    .prose ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.6rem; }
    .prose code { background: rgba(120, 120, 120, 0.2); padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
    .prose pre { background: rgba(30, 30, 30, 0.85); color: #e5e7eb; padding: 0.8rem; border-radius: 8px; overflow-x: auto; margin-bottom: 0.8rem; }
    .prose blockquote { border-left: 4px solid #3b82f6; padding-left: 0.8rem; margin: 0.8rem 0; opacity: 0.85; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <div class="flex-1 flex overflow-hidden h-screen">
    
    <!-- Боковая панель со списком заметок -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 flex flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 z-20 flex-shrink-0 transition-transform">
      <!-- Шапка списка -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="notebook-pen" class="w-6 h-6 text-blue-600"></i>
          <h1 class="text-xl font-bold tracking-tight">Notes</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="themeToggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400" title="Сменить тему">
            <i data-lucide="moon" class="w-5 h-5"></i>
          </button>
          <button id="newNoteBtn" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow-sm transition">
            <i data-lucide="plus" class="w-4 h-4"></i> Новая
          </button>
        </div>
      </div>

      <!-- Поиск и фильтры -->
      <div class="p-3 border-b border-slate-200 dark:border-slate-800 space-y-2">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Поиск заметок..." 
                 class="w-full pl-9 pr-3 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <!-- Список тегов -->
        <div id="tagsFilter" class="flex gap-1.5 overflow-x-auto hide-scrollbar py-1 text-xs">
          <button class="tag-chip active px-2.5 py-1 rounded-full bg-blue-600 text-white font-medium" data-tag="all">Все</button>
        </div>
      </div>

      <!-- Список заметок -->
      <div id="notesList" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/50 p-2 space-y-1">
        <!-- Карточки генерируются скриптом -->
      </div>

      <!-- Нижняя панель резервного копирования -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500">
        <span id="notesCount">0 заметок</span>
        <div class="flex gap-2">
          <button id="exportBtn" class="hover:text-blue-500 transition">Экспорт</button>
          <span>•</span>
          <label class="hover:text-blue-500 transition cursor-pointer">
            Импорт <input type="file" id="importInput" accept=".json" class="hidden">
          </label>
        </div>
      </div>
    </aside>

    <!-- Основная область: Редактор / Просмотр -->
    <main id="editorContainer" class="flex-1 flex flex-col bg-white dark:bg-slate-900 hidden md:flex h-full overflow-hidden">
      <!-- Панель управления заметкой -->
      <header class="p-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <button id="backToListBtn" class="md:hidden p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>
          <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 rounded-lg p-1 text-xs">
            <button id="modeEdit" class="px-2.5 py-1 rounded font-medium bg-white dark:bg-slate-700 shadow-sm">Редактор</button>
            <button id="modePreview" class="px-2.5 py-1 rounded font-medium text-slate-500 hover:text-slate-800 dark:hover:text-white">Просмотр</button>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="pinBtn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" title="Закрепить">
            <i data-lucide="pin" class="w-4 h-4"></i>
          </button>
          <button id="downloadBtn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" title="Скачать .md">
            <i data-lucide="download" class="w-4 h-4"></i>
          </button>
          <button id="deleteBtn" class="p-2 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30" title="Удалить">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- Поля ввода -->
      <div class="p-4 flex flex-col gap-2 border-b border-slate-100 dark:border-slate-800">
        <input type="text" id="noteTitle" placeholder="Заголовок заметки..." 
               class="text-2xl font-bold bg-transparent outline-none placeholder-slate-400">
        <input type="text" id="noteTags" placeholder="Теги через запятую (например: работа, идеи)..." 
               class="text-xs text-blue-600 dark:text-blue-400 bg-transparent outline-none placeholder-slate-400">
      </div>

      <!-- Текст и Превью -->
      <div class="flex-1 overflow-hidden relative">
        <textarea id="noteContent" placeholder="Напишите что-нибудь в формате Markdown..." 
                  class="w-full h-full p-4 bg-transparent outline-none resize-none font-mono text-sm leading-relaxed hide-scrollbar"></textarea>
        
        <div id="previewArea" class="prose dark:prose-invert max-w-none w-full h-full p-6 overflow-y-auto hidden"></div>
      </div>
    </main>

  </div>

  <script>
    // --- Состояние приложения ---
    let notes = JSON.parse(localStorage.getItem('notes_app_data')) || [
      {
        id: '1',
        title: 'Добро пожаловать в Notes!',
        content: '# Мой личный сервис заметок\n\n- Работает оффлайн\n- Поддерживает **Markdown**\n- Сохраняет всё в браузере\n- Готов к установке на Android как PWA',
        tags: ['привет', 'инфо'],
        pinned: true,
        updatedAt: new Date().toISOString()
      }
    ];

    let currentNoteId = notes[0]?.id || null;
    let selectedTag = 'all';
    let searchQuery = '';

    // --- Инициализация ---
    window.addEventListener('DOMContentLoaded', () => {
      // Инициализация темы
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }

      renderNotes();
      renderTags();
      loadCurrentNote();
      lucide.createIcons();
    });

    function saveToStorage() {
      localStorage.setItem('notes_app_data', JSON.stringify(notes));
      renderNotes();
      renderTags();
    }

    // --- Отрисовка списка ---
    function renderNotes() {
      const container = document.getElementById('notesList');
      const filtered = notes.filter(n => {
        const matchesTag = selectedTag === 'all' || (n.tags && n.tags.includes(selectedTag));
        const matchesSearch = n.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              n.content.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesTag && matchesSearch;
      }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.updatedAt) - new Date(a.updatedAt));

      document.getElementById('notesCount').textContent = `${notes.length} заметок`;

      container.innerHTML = filtered.map(note => `
        <div onclick="selectNote('${note.id}')" 
             class="p-3 rounded-lg cursor-pointer transition ${note.id === currentNoteId ? 'bg-blue-50 dark:bg-slate-800 border-l-4 border-blue-600' : 'hover:bg-slate-100 dark:hover:bg-slate-800/60'}">
          <div class="flex items-center justify-between">
            <h3 class="font-semibold text-sm truncate flex-1">${note.title || 'Без названия'}</h3>
            ${note.pinned ? '<i data-lucide="pin" class="w-3.5 h-3.5 text-blue-500 fill-blue-500 ml-1"></i>' : ''}
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mt-1">${note.content.replace(/[#*`]/g, '') || 'Нет содержимого...'}</p>
          <div class="flex items-center gap-1.5 mt-2 flex-wrap">
            ${(note.tags || []).map(t => `<span class="text-[10px] bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded text-slate-600 dark:text-slate-300">#${t}</span>`).join('')}
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function renderTags() {
      const tags = ['all', ...new Set(notes.flatMap(n => n.tags || []))];
      const container = document.getElementById('tagsFilter');
      container.innerHTML = tags.map(t => `
        <button onclick="setTag('${t}')" class="px-2.5 py-1 rounded-full whitespace-nowrap text-xs transition ${selectedTag === t ? 'bg-blue-600 text-white font-medium' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}">
          ${t === 'all' ? 'Все' : '#' + t}
        </button>
      `).join('');
    }

    function setTag(tag) {
      selectedTag = tag;
      renderTags();
      renderNotes();
    }

    // --- Работа с текущей заметкой ---
    function selectNote(id) {
      currentNoteId = id;
      loadCurrentNote();
      renderNotes();
      
      // На мобильных устройствах переключаемся на окно редактора
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('editorContainer').classList.remove('hidden');
      }
    }

    function loadCurrentNote() {
      const note = notes.find(n => n.id === currentNoteId);
      const titleInput = document.getElementById('noteTitle');
      const contentInput = document.getElementById('noteContent');
      const tagsInput = document.getElementById('noteTags');
      const pinBtn = document.getElementById('pinBtn');

      if (!note) {
        titleInput.value = '';
        contentInput.value = '';
        tagsInput.value = '';
        return;
      }

      titleInput.value = note.title;
      contentInput.value = note.content;
      tagsInput.value = (note.tags || []).join(', ');
      
      if (note.pinned) {
        pinBtn.classList.add('text-blue-600');
      } else {
        pinBtn.classList.remove('text-blue-600');
      }

      updatePreview();
    }

    // --- Автосохранение при вводе ---
    function autoSave() {
      const note = notes.find(n => n.id === currentNoteId);
      if (!note) return;

      note.title = document.getElementById('noteTitle').value;
      note.content = document.getElementById('noteContent').value;
      note.tags = document.getElementById('noteTags').value
        .split(',')
        .map(t => t.trim().toLowerCase())
        .filter(Boolean);
      note.updatedAt = new Date().toISOString();

      saveToStorage();
      updatePreview();
    }

    document.getElementById('noteTitle').addEventListener('input', autoSave);
    document.getElementById('noteContent').addEventListener('input', autoSave);
    document.getElementById('noteTags').addEventListener('input', autoSave);

    // --- Создание новой заметки ---
    document.getElementById('newNoteBtn').addEventListener('click', () => {
      const newNote = {
        id: Date.now().toString(),
        title: '',
        content: '',
        tags: [],
        pinned: false,
        updatedAt: new Date().toISOString()
      };
      notes.unshift(newNote);
      currentNoteId = newNote.id;
      saveToStorage();
      loadCurrentNote();
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('editorContainer').classList.remove('hidden');
      }
      document.getElementById('noteTitle').focus();
    });

    // --- Удаление заметки ---
    document.getElementById('deleteBtn').addEventListener('click', () => {
      if (!currentNoteId) return;
      if (confirm('Удалить эту заметку?')) {
        notes = notes.filter(n => n.id !== currentNoteId);
        currentNoteId = notes[0]?.id || null;
        saveToStorage();
        loadCurrentNote();
        if (window.innerWidth < 768) {
          document.getElementById('sidebar').classList.remove('hidden');
          document.getElementById('editorContainer').classList.add('hidden');
        }
      }
    });

    // --- Закрепление заметки ---
    document.getElementById('pinBtn').addEventListener('click', () => {
      const note = notes.find(n => n.id === currentNoteId);
      if (!note) return;
      note.pinned = !note.pinned;
      saveToStorage();
      loadCurrentNote();
    });

    // --- Режимы Редактор / Просмотр ---
    const modeEdit = document.getElementById('modeEdit');
    const modePreview = document.getElementById('modePreview');
    const contentArea = document.getElementById('noteContent');
    const previewArea = document.getElementById('previewArea');

    function updatePreview() {
      const content = document.getElementById('noteContent').value;
      previewArea.innerHTML = marked.parse(content || '*Пусто...*');
    }

    modeEdit.addEventListener('click', () => {
      modeEdit.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm');
      modeEdit.classList.remove('text-slate-500');
      modePreview.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm');
      modePreview.classList.add('text-slate-500');
      contentArea.classList.remove('hidden');
      previewArea.classList.add('hidden');
    });

    modePreview.addEventListener('click', () => {
      modePreview.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm');
      modePreview.classList.remove('text-slate-500');
      modeEdit.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm');
      modeEdit.classList.add('text-slate-500');
      updatePreview();
      contentArea.classList.add('hidden');
      previewArea.classList.remove('hidden');
    });

    // --- Мобильная навигация «Назад» ---
    document.getElementById('backToListBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('editorContainer').classList.add('hidden');
    });

    // --- Поиск ---
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderNotes();
    });

    // --- Смена темы ---
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // --- Экспорт Markdown файла ---
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const note = notes.find(n => n.id === currentNoteId);
      if (!note) return;
      const blob = new Blob([note.content], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${note.title || 'note'}.md`;
      a.click();
    });

    // --- Экспорт/Импорт всей базы в JSON ---
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `notes_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    });

    document.getElementById('importInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            notes = imported;
            saveToStorage();
            loadCurrentNote();
            alert('Заметки успешно импортированы!');
          }
        } catch (err) {
          alert('Ошибка при чтении файла бэкапа');
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
